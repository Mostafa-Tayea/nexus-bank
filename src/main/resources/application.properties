spring.application.name=nexus-bank

#
# JDBC Properties
#
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:test}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# add logging config to display SQL statements
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# configure JPA/Hibernate to validate schema against Flyway migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

#
# Flyway Properties
#
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

#
# Auth Properties
#
auth.max-failed-attempts=5

#
# JWT Properties
#
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

#
# CORS Properties
#
cors.allowed-origins=http://localhost:3000,http://localhost:8080

#
# Cache Type (simple = in-memory, switch to redis when Redis is available)
#
spring.cache.type=simple

#
# Redis Properties
#
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=5000ms

#
# Cache TTL Properties (in seconds)
#
cache.ttl.user=3600
cache.ttl.account=1800
cache.ttl.role=7200
cache.ttl.otp=900
cache.ttl.refresh-token=600
cache.ttl.notification=900
cache.ttl.notification-count=300
cache.ttl.jwt-blacklist=3600

#
# Rate Limiting Properties
#
rate-limit.endpoints.auth.register.capacity=10
rate-limit.endpoints.auth.register.refill-tokens=10
rate-limit.endpoints.auth.register.refill-duration-seconds=60

rate-limit.endpoints.auth.login.capacity=5
rate-limit.endpoints.auth.login.refill-tokens=5
rate-limit.endpoints.auth.login.refill-duration-seconds=60

rate-limit.endpoints.auth.forgot-password.capacity=3
rate-limit.endpoints.auth.forgot-password.refill-tokens=3
rate-limit.endpoints.auth.forgot-password.refill-duration-seconds=300

rate-limit.endpoints.auth.reset-password.capacity=3
rate-limit.endpoints.auth.reset-password.refill-tokens=3
rate-limit.endpoints.auth.reset-password.refill-duration-seconds=300

rate-limit.endpoints.auth.verify-otp.capacity=10
rate-limit.endpoints.auth.verify-otp.refill-tokens=10
rate-limit.endpoints.auth.verify-otp.refill-duration-seconds=60

rate-limit.endpoints.auth.refresh-token.capacity=20
rate-limit.endpoints.auth.refresh-token.refill-tokens=20
rate-limit.endpoints.auth.refresh-token.refill-duration-seconds=60

rate-limit.endpoints.auth.verify-email.capacity=5
rate-limit.endpoints.auth.verify-email.refill-tokens=5
rate-limit.endpoints.auth.verify-email.refill-duration-seconds=60

rate-limit.endpoints.transaction.deposit.capacity=20
rate-limit.endpoints.transaction.deposit.refill-tokens=20
rate-limit.endpoints.transaction.deposit.refill-duration-seconds=60

rate-limit.endpoints.transaction.withdraw.capacity=10
rate-limit.endpoints.transaction.withdraw.refill-tokens=10
rate-limit.endpoints.transaction.withdraw.refill-duration-seconds=60

rate-limit.endpoints.transaction.transfer.capacity=20
rate-limit.endpoints.transaction.transfer.refill-tokens=20
rate-limit.endpoints.transaction.transfer.refill-duration-seconds=60

rate-limit.endpoints.account.create.capacity=5
rate-limit.endpoints.account.create.refill-tokens=5
rate-limit.endpoints.account.create.refill-duration-seconds=300

#
# Scheduler Properties
#
scheduler.cleanup.otp-cron=0 0 3 * * ?
scheduler.cleanup.verification-token-cron=0 0 3 * * ?
scheduler.cleanup.refresh-token-cron=0 0 2 * * ?
scheduler.cleanup.notification-cron=0 0 4 * * ?
scheduler.cleanup.audit-cron=0 0 4 * * ?
scheduler.cleanup.transfer-limit-reset-cron=0 0 0 * * ?
scheduler.cleanup.cache-cron=0 0 1 * * ?

scheduler.cleanup.notification-retention-days=90
scheduler.cleanup.audit-retention-days=365

#
# Mail / SMTP Properties
#
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=memosalah553@gmail.com
spring.mail.password=roqrdfsfbzumwqaf
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#
# OpenAPI / Swagger Properties
#
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.operation-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.doc-expansion=list